name: Build Parquet data package

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Comma-separated profiles (encode,geo,gtex)"
        required: true
        default: "encode,geo,gtex"
      max_genes:
        description: "Optional gene slice (empty = profile default / full)"
        required: false
        default: ""
      max_samples:
        description: "Optional sample slice (empty = profile default / full)"
        required: false
        default: ""
      smoke:
        description: "Fast smoke build (max-genes 500, max-samples 20 unless overridden)"
        type: boolean
        required: false
        default: false
      create_release:
        description: "Attach tarball to a GitHub Release"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag when create_release is true (e.g. data-v1)"
        required: false
        default: "data-latest"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check free disk
        run: |
          set -euo pipefail
          # Full package peaks ~2–3 GiB; leave headroom for Python/deps/tarball.
          AVAIL_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Free disk ≈ ${AVAIL_GB} GiB"
          if [ "$AVAIL_GB" -lt 5 ]; then
            echo "::error::Need at least ~5 GiB free for export (have ${AVAIL_GB} GiB). Use smoke=true or free disk."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-export.txt

      # Cache keys cannot contain commas. Profile URLs live in the YAMLs, so
      # hashFiles alone is enough — subset runs (encode-only) still restore.
      - name: Cache download cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: export-cache-${{ hashFiles('scripts/profiles/*.yaml', 'scripts/requirements-export.txt') }}
          restore-keys: |
            export-cache-

      - name: Install export deps
        run: pip install -r scripts/requirements-export.txt

      - name: Build package
        env:
          INPUT_PROFILES: ${{ inputs.profiles }}
          INPUT_MAX_GENES: ${{ inputs.max_genes }}
          INPUT_MAX_SAMPLES: ${{ inputs.max_samples }}
          INPUT_SMOKE: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          PROFILES="${INPUT_PROFILES}"
          MAX_GENES="${INPUT_MAX_GENES}"
          MAX_SAMPLES="${INPUT_MAX_SAMPLES}"
          # workflow_dispatch booleans render as the strings "true" / "false"
          if [ "${INPUT_SMOKE}" = "true" ]; then
            if [ -z "$MAX_GENES" ]; then MAX_GENES=500; fi
            if [ -z "$MAX_SAMPLES" ]; then MAX_SAMPLES=20; fi
            echo "Smoke mode: max_genes=${MAX_GENES} max_samples=${MAX_SAMPLES}"
          fi
          ARGS=(--profiles "$PROFILES" --out dist/data-package)
          if [ -n "$MAX_GENES" ]; then
            ARGS+=(--max-genes "$MAX_GENES")
          fi
          if [ -n "$MAX_SAMPLES" ]; then
            ARGS+=(--max-samples "$MAX_SAMPLES")
          fi
          python scripts/export_parquet.py "${ARGS[@]}"

      - name: Hydrate genes from GTF/GFF
        run: python scripts/hydrate_genes.py --package dist/data-package

      - name: Disk usage after hydrate
        run: |
          set -euo pipefail
          du -sh scripts/.cache dist/data-package || true
          df -h .

      - name: Verify package
        run: python scripts/verify_data_package.py --package dist/data-package

      - name: Pack tarball
        run: |
          set -euo pipefail
          tar -C dist -cJf dist/data-package.tar.xz data-package
          ls -lh dist/data-package.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rnaget-data-package
          path: dist/data-package.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          FILE="dist/data-package.tar.xz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "$TAG" \
              --notes "Parquet data package (encode/geo/gtex). Sync to NFS and point the API at the extracted package. Full gtex may need a large runner or smoke=true slices."
          fi
