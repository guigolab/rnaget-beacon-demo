name: Build Parquet data package

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Comma-separated catalog sources (encode,geo,gtex); builds every matrix for each source"
        required: true
        default: "encode,geo,gtex"
      max_genes:
        description: "Optional gene slice (empty = profile default / full)"
        required: false
        default: ""
      max_samples:
        description: "Optional sample slice (empty = profile default / full)"
        required: false
        default: ""
      smoke:
        description: "Fast smoke build (max-genes 500, max-samples 20 unless overridden)"
        type: boolean
        required: false
        default: false
      create_release:
        description: "Attach tarball to a GitHub Release"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag when create_release is true (e.g. data-v1)"
        required: false
        default: "data-latest"

concurrency:
  group: data-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assert committed test fixtures
        run: |
          set -euo pipefail
          f=beacon-schemas/framework/json/responses/beaconResultsetsResponse.json
          if [ ! -f "$f" ]; then
            echo "::error::Missing $f — commit beacon-schemas/framework/json before running this workflow"
            exit 1
          fi

      - name: Check free disk
        run: |
          set -euo pipefail
          # Full package peaks ~2–3 GiB; leave headroom for Python/deps/tarball.
          AVAIL_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Free disk ≈ ${AVAIL_GB} GiB"
          if [ "$AVAIL_GB" -lt 5 ]; then
            echo "::error::Need at least ~5 GiB free for export (have ${AVAIL_GB} GiB). Use smoke=true or free disk."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-export.txt

      # Cache keys cannot contain commas. Profile URLs live in the catalog, so
      # hashFiles alone is enough — subset runs (encode-only) still restore.
      - name: Cache download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: scripts/.cache
          key: export-cache-${{ hashFiles('scripts/profiles/datasets.yaml', 'scripts/requirements-export.txt', 'scripts/data/geo_biosample_ontology.json', 'scripts/data/geo_biosample_status.json', 'scripts/data/biosample_measurements.json', 'scripts/data/gff_type_to_so.json', 'scripts/data/biotype_to_so.json') }}
          restore-keys: |
            export-cache-

      - name: Install export deps
        run: pip install -r scripts/requirements-export.txt

      - name: Build package
        env:
          INPUT_PROFILES: ${{ inputs.profiles }}
          INPUT_MAX_GENES: ${{ inputs.max_genes }}
          INPUT_MAX_SAMPLES: ${{ inputs.max_samples }}
          INPUT_SMOKE: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          PROFILES="${INPUT_PROFILES}"
          MAX_GENES="${INPUT_MAX_GENES}"
          MAX_SAMPLES="${INPUT_MAX_SAMPLES}"
          # workflow_dispatch booleans render as the strings "true" / "false"
          if [ "${INPUT_SMOKE}" = "true" ]; then
            if [ -z "$MAX_GENES" ]; then MAX_GENES=500; fi
            if [ -z "$MAX_SAMPLES" ]; then MAX_SAMPLES=20; fi
            echo "Smoke mode: max_genes=${MAX_GENES} max_samples=${MAX_SAMPLES}"
          fi
          ARGS=(--profiles "$PROFILES" --out dist/data-package)
          if [ -n "$MAX_GENES" ]; then
            ARGS+=(--max-genes "$MAX_GENES")
          fi
          if [ -n "$MAX_SAMPLES" ]; then
            ARGS+=(--max-samples "$MAX_SAMPLES")
          fi
          python scripts/export_parquet.py "${ARGS[@]}"

      - name: Hydrate genes from GTF/GFF
        run: python scripts/hydrate_genes.py --package dist/data-package

      - name: Enrich gene xrefs and GO slim
        run: python scripts/enrich_gene_annotations.py --package dist/data-package

      - name: Build feature/biosample indexes
        run: python scripts/build_feature_indexes.py --package dist/data-package

      - name: Build filtering terms catalog
        run: python scripts/build_filtering_terms.py --package dist/data-package

      - name: Build expression stats
        run: python scripts/build_expression_stats.py --package dist/data-package

      - name: Disk usage after hydrate
        run: |
          set -euo pipefail
          du -sh scripts/.cache dist/data-package || true
          df -h .

      - name: Verify package
        run: python scripts/verify_data_package.py --package dist/data-package

      - name: Test API against package
        working-directory: server
        env:
          RNAGET_BUILT_PACKAGE: ${{ github.workspace }}/dist/data-package
        run: |
          set -euo pipefail
          pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Pack tarball
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update && sudo apt-get install -y zstd
          fi
          tar -C dist -cf - data-package | zstd -T0 -3 -o dist/data-package.tar.zst
          ls -lh dist/data-package.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rnaget-data-package
          path: dist/data-package.tar.zst
          if-no-files-found: error
          retention-days: 14

  release:
    needs: export
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rnaget-data-package
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          FILE="$(find release-assets -name 'data-package.tar.zst' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "::error::data-package.tar.zst missing from artifact"
            exit 1
          fi
          BYTES=$(stat -c%s "$FILE")
          LIMIT=$((2 * 1024 * 1024 * 1024))
          if [ "$BYTES" -ge "$LIMIT" ]; then
            echo "::error::Release asset is ${BYTES} bytes; GitHub's per-asset limit is 2 GiB"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GH_REPO" \
              --title "$TAG" \
              --notes "Parquet data package from scripts/profiles/datasets.yaml."
          fi
