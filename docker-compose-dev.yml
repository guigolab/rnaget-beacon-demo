# Local prod simulation: build images from this tree.
# Prepare data first (data/ is gitignored; empty mount → API fail-fast):
#   pipenv run python scripts/fetch_data_package.py --out data/rnaget-demo --force
# Then:
#   docker compose -f docker-compose-dev.yml up --build
#
# UI:  http://localhost:94/rnaget-beacon/
# API: http://localhost:94/rnaget-beacon/api/  (also direct :5000)

services:

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /rnaget-beacon/api
    container_name: rnaget-nginx
    restart: always
    environment:
      - API_PORT=5000
      - API_HOST=rnaget-server
      - BASE_PATH=/rnaget-beacon
    ports:
      - "94:5000"
    depends_on:
      - server

  server:
    build: ./server
    container_name: rnaget-server
    restart: always
    volumes:
      - ./data/rnaget-demo:/data/package:ro
    environment:
      - DATA_PACKAGE_PATH=/data/package
      - BEACON_BASE_URL=http://localhost:94/rnaget-beacon/api
      - CORS_ALLOW_ORIGINS=*
    ports:
      - "5000:5000"
