services:

  rnaget-nginx:
    image: gitlab.hpc.crg.es:5005/monstre/rnaget-beacon-demo/rnaget-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /rnaget-beacon/api
    container_name: rnaget-nginx
    restart: always
    environment:
      - API_PORT=5000
      - API_HOST=rnaget-server
      - BASE_PATH=/rnaget-beacon
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rnaget-nginx.rule=(Host(`genome.crg.es`) || Host(`genome.crg.cat`) || Host(`genome.crg.eu`)) && PathPrefix(`/rnaget-beacon`)"
      - "traefik.http.routers.rnaget-nginx.tls=true"
      - "traefik.http.routers.rnaget-nginx.entrypoints=web_https"
      - "traefik.http.services.rnaget-nginx.loadBalancer.server.port=80"
    ports:
      - "94:5000"
    networks:
      - monstre
    depends_on:
      - rnaget-server

  rnaget-server:
    image: gitlab.hpc.crg.es:5005/monstre/rnaget-beacon-demo/rnaget-server
    container_name: rnaget-server
    restart: always
    volumes:
      # Host package: python3 scripts/fetch_data_package.py --out /data/rnaget-demo
      - /data/rnaget-demo:/data/package:ro
    environment:
      - DATA_PACKAGE_PATH=/data/package
      - BEACON_BASE_URL=https://genome.crg.es/rnaget-beacon/api
      - CORS_ALLOW_ORIGINS=*
    networks:
      - monstre

networks:
  monstre:
    external: true
    name: monstre
