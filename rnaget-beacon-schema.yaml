components:
  schemas:
    AlphanumericFilter:
      properties:
        id:
          title: Id
          type: string
        operator:
          default: '='
          title: Operator
          type: string
        value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          title: Value
        scope:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Scope
      required:
      - id
      - value
      title: AlphanumericFilter
      type: object
    AxisOrder:
      type: string
      enum:
      - asc
      - desc
      title: AxisOrder
      description: Order expression_values by cell quantification.
    BeaconErrorBody:
      properties:
        errorCode:
          title: Errorcode
          type: integer
        errorMessage:
          title: Errormessage
          type: string
      required:
      - errorCode
      - errorMessage
      title: BeaconErrorBody
      type: object
    BeaconErrorResponse:
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          $ref: '#/components/schemas/BeaconErrorBody'
      required:
      - meta
      - error
      title: BeaconErrorResponse
      type: object
    BeaconFilteringTermsResponse:
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        response:
          $ref: '#/components/schemas/FilteringTermsPayload'
      required:
      - meta
      - response
      title: BeaconFilteringTermsResponse
      type: object
    BeaconInformationalResponse:
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        response:
          title: Response
          type: object
      required:
      - meta
      - response
      title: BeaconInformationalResponse
      type: object
    BeaconQuery:
      properties:
        requestedGranularity:
          anyOf:
          - $ref: '#/components/schemas/Granularity'
          - type: 'null'
          default: null
        pagination:
          anyOf:
          - $ref: '#/components/schemas/Pagination'
          - type: 'null'
          default: null
        filters:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/AlphanumericFilter'
              - $ref: '#/components/schemas/OntologyFilter'
              - $ref: '#/components/schemas/CustomFilter'
            type: array
          - type: 'null'
          default: null
          title: Filters
        requestParameters:
          anyOf:
          - $ref: '#/components/schemas/BeaconRequestParameters'
          - type: 'null'
          default: null
        includeResultsetResponses:
          anyOf:
          - $ref: '#/components/schemas/IncludeResultsetResponses'
          - type: 'null'
          default: null
        testMode:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Testmode
      title: BeaconQuery
      type: object
    BeaconRequestBody:
      properties:
        meta:
          anyOf:
          - $ref: '#/components/schemas/BeaconRequestMeta'
          - type: 'null'
        query:
          anyOf:
          - $ref: '#/components/schemas/BeaconQuery'
          - type: 'null'
      additionalProperties: false
      type: object
      title: BeaconRequestBody
    BeaconRequestMeta:
      properties:
        apiVersion:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Apiversion
      title: BeaconRequestMeta
      type: object
    BeaconRequestParameters:
      additionalProperties: false
      description: 'RNAget requestParameters under query.requestParameters.


        Route-specific: nested matrix features → featureIDList only; nested

        biosamples → biosampleIDList only; expression_values → both ID lists,

        minValue/maxValue, and order (by cell value). Cross-links use matrixIDList.'
      properties:
        featureIDList:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Comma-separated feature IDs (matrix row accessions).
          title: Featureidlist
        biosampleIDList:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Comma-separated biosample IDs.
          title: Biosampleidlist
        matrixIDList:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Comma-separated matrix IDs (cross-link listings).
          title: Matrixidlist
        minValue:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Minimum expression value (expression_values only).
          title: Minvalue
        maxValue:
          anyOf:
          - type: number
          - type: 'null'
          default: null
          description: Maximum expression value (expression_values only).
          title: Maxvalue
        order:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 'Order expression_values by cell value: asc | desc.'
          title: Order
      title: BeaconRequestParameters
      type: object
    CustomFilter:
      properties:
        id:
          title: Id
          type: string
        scope:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Scope
      required:
      - id
      title: CustomFilter
      type: object
    ExpressionValuesRequestBody:
      properties:
        meta:
          anyOf:
          - $ref: '#/components/schemas/BeaconRequestMeta'
          - type: 'null'
        query:
          anyOf:
          - $ref: '#/components/schemas/BeaconQuery'
          - type: 'null'
      additionalProperties: false
      type: object
      title: ExpressionValuesRequestBody
      description: 'POST body for matrix expression_values.


        Slice params under ``query.requestParameters``:

        featureIDList, biosampleIDList, minValue, maxValue, order (by value).

        Top-level sibling fields and ``sort`` are not accepted.'
    FilteringTermsPayload:
      properties:
        filteringTerms:
          items:
            type: object
          title: Filteringterms
          type: array
        resources:
          items:
            type: object
          title: Resources
          type: array
      title: FilteringTermsPayload
      type: object
    Granularity:
      enum:
      - boolean
      - count
      - record
      title: Granularity
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IncludeResultsetResponses:
      enum:
      - ALL
      - HIT
      - MISS
      - NONE
      title: IncludeResultsetResponses
      type: string
    MatrixAxisRequestBody:
      properties:
        meta:
          anyOf:
          - $ref: '#/components/schemas/BeaconRequestMeta'
          - type: 'null'
        query:
          anyOf:
          - $ref: '#/components/schemas/BeaconQuery'
          - type: 'null'
      additionalProperties: false
      type: object
      title: MatrixAxisRequestBody
      description: 'POST body for nested matrix features / biosamples listings.


        Under ``query.requestParameters``: features accept ``featureIDList`` only;

        biosamples accept ``biosampleIDList`` only.'
    OntologyFilter:
      properties:
        id:
          title: Id
          type: string
        scope:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Scope
        includeDescendantTerms:
          anyOf:
          - type: boolean
          - type: 'null'
          default: true
          title: Includedescendantterms
        similarity:
          anyOf:
          - type: string
          - type: 'null'
          default: exact
          title: Similarity
      required:
      - id
      title: OntologyFilter
      type: object
    Pagination:
      properties:
        skip:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: 0
          title: Skip
        limit:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          default: 10
          title: Limit
        currentPage:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Currentpage
        nextPage:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Nextpage
        previousPage:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Previouspage
      title: Pagination
      type: object
    ResponseMeta:
      properties:
        apiVersion:
          title: Apiversion
          type: string
        beaconId:
          title: Beaconid
          type: string
        returnedGranularity:
          anyOf:
          - $ref: '#/components/schemas/Granularity'
          - type: 'null'
          default: null
        returnedSchemas:
          items:
            additionalProperties:
              type: string
            type: object
          title: Returnedschemas
          type: array
        receivedRequestSummary:
          anyOf:
          - type: object
          - type: 'null'
          default: null
          title: Receivedrequestsummary
      required:
      - apiVersion
      - beaconId
      title: ResponseMeta
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BeaconBooleanResponse:
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        responseSummary:
          $ref: '#/components/schemas/ResponseSummary'
      required:
      - meta
      - responseSummary
      title: BeaconBooleanResponse
      type: object
    BeaconCountResponse:
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        responseSummary:
          $ref: '#/components/schemas/ResponseSummary'
      required:
      - meta
      - responseSummary
      title: BeaconCountResponse
      type: object
    BeaconResultsetsResponse:
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        responseSummary:
          $ref: '#/components/schemas/ResponseSummary'
        response:
          $ref: '#/components/schemas/ResultsetsPayload'
      required:
      - meta
      - responseSummary
      - response
      title: BeaconResultsetsResponse
      type: object
    ResponseSummary:
      properties:
        exists:
          title: Exists
          type: boolean
        numTotalResults:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Numtotalresults
      required:
      - exists
      title: ResponseSummary
      type: object
    ResultsetInstance:
      properties:
        id:
          title: Id
          type: string
        setType:
          title: Settype
          type: string
        exists:
          title: Exists
          type: boolean
        resultsCount:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Resultscount
        results:
          type: array
          nullable: true
          description: 'Page of entity records. Item schema depends on setType: matrix
            → Matrix, feature → GenomicFeature, biosample → Biosample, expressionValue
            → ExpressionValue.'
          items:
            oneOf:
            - $ref: '#/components/schemas/Matrix'
            - $ref: '#/components/schemas/GenomicFeature'
            - $ref: '#/components/schemas/Biosample'
            - $ref: '#/components/schemas/ExpressionValue'
      required:
      - id
      - setType
      - exists
      title: ResultsetInstance
      type: object
    ResultsetsPayload:
      properties:
        resultSets:
          items:
            $ref: '#/components/schemas/ResultsetInstance'
          title: Resultsets
          type: array
      required:
      - resultSets
      title: ResultsetsPayload
      type: object
    Matrix:
      additionalProperties: true
      description: Metadata for an RNA-seq quantification matrix available in the
        Beacon. Cell-level values are represented as expressionValue entries (or retrieved
        via matrix expression_values endpoints); this object describes how those values
        and feature identifiers should be interpreted.
      properties:
        matrixId:
          description: Unique identifier of the matrix entry within the Beacon.
          examples:
          - matrix-gene-expression-001
          type: string
        createDateTime:
          description: The time the matrix was created (ISO 8601 format).
          format: date-time
          type: string
          examples:
          - '2017-01-17T20:33:40Z'
        description:
          description: Description of the matrix.
          examples:
          - This matrix provides examples of the actual data in this Beacon instance.
          type: string
        downloadUrl:
          description: Optional URL to download the full matrix (RFC 3986). Bulk download
            is not required when sliced expression values are served via the API.
          examples:
          - https://example.org/matrices/matrix.csv
          type: string
        reproducible:
          type: boolean
          description: Whether this Beacon provides enough provenance to regenerate
            the quantification matrix (annotation source, version and file, assembly,
            units/scale, and analysis/protocol information). true means that information
            is available; false means provenance is incomplete and the matrix should
            not be treated as independently reproducible from Beacon metadata alone.
          examples:
          - true
          - false
        assayType:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            label:
              type: string
          required:
          - id
          description: Type of RNA-seq assay (e.g. bulk vs single-cell).
          examples:
          - id: OBI:0002631
            label: single-cell RNA sequencing assay
          - id: OBI:0003090
            label: bulk RNA-seq assay
        info:
          type: object
          additionalProperties: true
          description: Optional free-form metadata bag.
        name:
          description: Human-readable name of the matrix.
          examples:
          - Gene expression matrix
          type: string
        dimensions:
          description: Number of features (rows) and biosamples (columns) in the matrix.
          type: object
          properties:
            features:
              type: integer
              description: Number of genomic feature rows.
            biosamples:
              type: integer
              description: Number of biosample columns.
          required:
          - features
          - biosamples
        featureTypes:
          description: Sequence Ontology terms for the class(es) of genomic feature
            rows in this matrix. Homogeneous matrices list one term (e.g. gene or
            mRNA). Matrices that mix genes and transcripts (or other feature classes)
            MUST list every class present. Each feature in the matrix MUST have a
            featureType that appears in this array. Values from SO (Sequence Ontology)
            are recommended.
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              label:
                type: string
            required:
            - id
          examples:
          - - id: SO:0000704
              label: gene
          - - id: SO:0000234
              label: mRNA
          - - id: SO:0000704
              label: gene
            - id: SO:0000234
              label: mRNA
        expressionUnitAndScale:
          description: Unit and numeric scale of expression values in this matrix.
            Applies to all expressionValue.value entries that reference this matrixId.
          type: object
          required:
          - unit
          - scale
          properties:
            unit:
              enum:
              - raw
              - TPM
              - FPKM
              - RPKM
              - CPM
              - RPM
              default: raw
              description: Quantification unit of the expression values.
            scale:
              enum:
              - linear
              - log2
              - log10
              default: linear
              description: Whether values are linear or log-transformed. If not provided,
                it is assumed to be linear.
        expressionValueRange:
          type: object
          description: Global minimum and maximum of expressionValue.value across
            this matrix. Uses the same unit and scale as expressionUnitAndScale. Optional;
            when present, clients may use it for colour scales without scanning all
            cells.
          required:
          - min
          - max
          properties:
            min:
              type: number
              description: Minimum expression value observed in the matrix.
            max:
              type: number
              description: Maximum expression value observed in the matrix.
        annotation:
          description: Annotation catalog used to define feature identifiers in this
            matrix. source SHOULD use the same identifiers.org-style prefix vocabulary
            as featureIdentifier.resource (e.g. ensembl, gencode). version is the
            annotation release; it is not the same as an Ensembl object version suffix
            (e.g. .18).
          type: object
          properties:
            source:
              type: string
              description: Identifier namespace / annotation catalog. An identifiers.org
                prefix is recommended.
              examples:
              - ensembl
              - gencode
              - refseq
              - ncbigene
            version:
              type: string
              description: Annotation release or build version string.
              examples:
              - '109'
              - '49'
              - '109.20190905'
            file:
              type: string
              description: URL to the annotation file.
            md5Checksum:
              type: string
              description: MD5 checksum of the annotation file.
          required:
          - source
          - version
        assembly:
          description: Reference genome assembly used to map reads and define genomic
            coordinates for features in this matrix.
          examples:
          - accession: GCA_000001405.29
            name: GRCh38.p14
          type: object
          properties:
            accession:
              description: Assembly accession (e.g. INSDC GCA_/GCF_).
              type: string
            name:
              description: Human-readable assembly name.
              type: string
          required:
          - accession
          - name
      required:
      - matrixId
      - expressionUnitAndScale
      - featureTypes
      - annotation
      - assembly
      - reproducible
      type: object
    Biosample:
      additionalProperties: true
      description: Schema for an biosample entry.
      properties:
        biosampleStatus:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Ontology value from Experimental Factor Ontology (EFO) Material
            Entity term (BFO:0000040). Classification of the sample in abnormal sample
            (EFO:0009655) or reference sample (EFO:0009654).
          examples:
          - id: EFO:0009654
            label: reference sample
          - id: EFO:0009655
            label: abnormal sample
          - id: EFO:0009656
            label: neoplastic sample
          - id: EFO:0010941
            label: metastasis sample
          - id: EFO:0010942
            label: primary tumor sample
          - id: EFO:0010943
            label: recurrent tumor sample
        collectionDate:
          description: Date of biosample collection in ISO8601 format.
          examples:
          - '2021-04-23'
          format: date
          type: string
        collectionMoment:
          description: Individual's or cell cullture age at the time of sample collection
            in the ISO8601 duration format `P[n]Y[n]M[n]DT[n]H[n]M[n]S`.
          examples:
          - P32Y6M1D
          - P7D
          type: string
        diagnosticMarkers:
          description: Clinically relevant biomarkers. RECOMMENDED.
          items:
            $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          type: array
        histologicalDiagnosis:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Disease diagnosis that was inferred from the histological examination.
            RECOMMENDED.
          examples:
          - id: NCIT:C3778
            label: Serous Cystadenocarcinoma
        id:
          description: Biosample identifier (external accession or internal ID).
          examples:
          - S0001
          type: string
        individualId:
          description: Reference to the individual from which that sample was obtained.
          examples:
          - P0001
          type: string
        info:
          $ref: ../common/info.json
        matrixIds:
          description: list of matrix ids
          items:
            type: string
          type: array
        measurements:
          description: List of measurements of the sample.
          items:
            $ref: ../common/measurement.json
          type: array
        notes:
          description: Any relevant info about the biosample that does not fit into
            any other field in the schema.
          examples:
          - Some free text
          type: string
        obtentionProcedure:
          $ref: ../common/procedure.json
          description: Ontology value from NCIT Intervention or Procedure ontology
            term (NCIT:C25218) describing the procedure for sample obtention, e.g.
            NCIT:C15189 (biopsy).
          examples:
          - code:
              id: NCIT:C15189
              label: biopsy
          - code:
              id: NCIT:C157179
              label: FGFR1 Mutation Analysis
        pathologicalStage:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Pathological stage, if applicable, preferably as subclass of
            NCIT:C28108 - Disease Stage Qualifier. RECOMMENDED.
          examples:
          - id: NCIT:C27977
            label: Stage IIIA
        pathologicalTnmFinding:
          description: Pathological TNM findings, if applicable, preferably as subclass
            of NCIT:C48698 - Cancer TNM Finding Category (NCIT:C48698). RECOMMENDED.
          examples:
          - id: NCIT:C48725
            label: T2a Stage Finding
          - id: NCIT:C48709
            label: N1c Stage Finding
          - id: NCIT:C48699
            label: M0 Stage Finding
          items:
            $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          type: array
        phenotypicFeatures:
          description: List of phenotypic abnormalities of the sample. RECOMMENDED.
          items:
            $ref: ../common/phenotypicFeature.json
          type: array
        sampleOriginDetail:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Tissue from which the sample was taken or sample origin matching
            the category set in 'sampleOriginType'. Value from Uber-anatomy ontology
            (UBERON) or BRENDA tissue / enzyme source (BTO), Ontology for Biomedical
            Investigations (OBI) or Cell Line Ontology (CLO), e.g. 'cerebellar vermis'
            (UBERON:0004720), 'HEK-293T cell' (BTO:0002181), 'nasopharyngeal swab
            specimen' (OBI:0002606), 'cerebrospinal fluid specimen' (OBI:0002502).
          examples:
          - id: UBERON:0000474
            label: female reproductive system
          - id: BTO:0002181
            label: HEK-293T cell
          - id: OBI:0002606
            label: nasopharyngeal swab specimen
        sampleOriginType:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Category of sample origin. Value from Ontology for Biomedical
            Investigations (OBI) material entity (BFO:0000040) ontology, e.g. 'specimen
            from organism' (OBI:0001479),'xenograft' (OBI:0100058), 'cell culture'
            (OBI:0001876)
          examples:
          - id: OBI:0001479
            label: specimen from organism
          - id: OBI:0001876
            label: cell culture
          - id: OBI:0100058
            label: xenograft
        sampleProcessing:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Status of how the specimen was processed,e.g. a child term
            of EFO:0009091.
          examples:
          - id: EFO:0009129
            label: mechanical dissociation
        sampleStorage:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Status of how the specimen was stored.
          example: {}
        tumorGrade:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Term representing the tumor grade. Child term of NCIT:C28076
            (Disease Grade Qualifier) or equivalent.
          examples:
          - id: NCIT:C28080
            label: Grade 3a
        tumorProgression:
          $ref: https://raw.githubusercontent.com/ga4gh-beacon/beacon-v2/main/framework/json/common/ontologyTerm.json
          description: Tumor progression category indicating primary, metastatic or
            recurrent progression. Ontology value from Neoplasm by Special Category
            ontology (NCIT:C7062), e.g. NCIT:C84509 (Primary Malignant Neoplasm).
          examples:
          - id: NCIT:C84509
            label: Primary Malignant Neoplasm
          - id: NCIT:C4813
            label: Recurrent Malignant Neoplasm
      required:
      - id
      - biosampleStatus
      - sampleOriginType
      title: biosample
      type: object
    GenomicFeature:
      additionalProperties: true
      description: A genomic feature (gene, transcript, exon, or genomic interval)
        used as a quantified row in RNA-seq expression matrices and/or as an annotated
        feature related to a genomic variant.
      properties:
        id:
          description: Internal feature ID.
          examples:
          - Feature12345
          type: string
        featureIdentifier:
          description: Identifier of the genomic feature as it appears in the expression
            matrix (native accession), plus the identifier namespace. Gene symbols
            MUST NOT be stored here; use aliases instead. Annotation release (e.g.
            Ensembl 109) belongs on the matrix annotation, not on this object.
          type: object
          properties:
            id:
              type: string
              description: Native accession of the genomic feature as used in the
                matrix row (versioned when the matrix uses versioned IDs). Not a CURIE.
                For anonymous or interval-derived features with no public accession,
                a locally minted identifier MUST be used.
              examples:
              - ENSG00000141510.18
              - ENST00000269305.9
              - EXON:00004567
            resource:
              type: string
              description: Identifier namespace for id. An identifiers.org prefix
                is recommended (e.g. ensembl, hgnc, ncbigene, refseq, gencode). Use
                local for locally minted identifiers. Required because id is not a
                CURIE.
              examples:
              - ensembl
              - hgnc
              - ncbigene
              - refseq
              - gencode
              - local
          required:
          - id
          - resource
          examples:
          - id: ENSG00000141510.18
            resource: ensembl
          - id: ENST00000269305.9
            resource: ensembl
          - id: EXON:00004567
            resource: local
        genomicInterval:
          description: Genomic interval of the genomic feature, uses the VRS schema
            for the coordinates and adds the strand
          type: object
          properties:
            location:
              $ref: https://w3id.org/ga4gh/schema/vrs/1.3/vrs.json#/definitions/Location
            strand:
              type: string
              enum:
              - positive
              - negative
              default: positive
        aliases:
          description: Human-readable names or symbols commonly used for this feature
            (gene symbols, transcript names, or other aliases).
          examples:
          - TP53
          - BRCA1
          type: array
          items:
            type: string
        xrefs:
          description: Cross-references of the genomic feature. CURIE format is recommended.
          examples:
          - HGNC:11998
          - NCBIGene:7157
          type: array
          items:
            type: string
        featureType:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            label:
              type: string
          required:
          - id
          description: Ontology term that describes the type of genomic feature. Values
            from SO (Sequence Ontology) are recommended.
          examples:
          - id: SO:0000704
            label: gene
          - id: SO:0000234
            label: mRNA
          - id: SO:0000147
            label: exon
        ontologyTerms:
          type: array
          description: Ontology terms of the genomic feature like biological functions,
            molecular effects, etc.
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: string
              label:
                type: string
            required:
            - id
          examples:
          - id: GO:0048856
            label: anatomical structure development
        relationship:
          type: object
          description: Hierarchical relationships of the genomic feature (gene ->
            transcript -> exon). parent and children MUST use the same native id form
            as featureIdentifier.id (not CURIEs).
          properties:
            parent:
              description: Parent of the genomic feature, usually a gene or transcript.
                Value MUST match the parent's featureIdentifier.id.
              examples:
              - ENSG00000141510.18
              - ENST00000269305.9
              type: string
            children:
              description: Children of the genomic feature, usually a transcript or
                exon. Values MUST match each child's featureIdentifier.id.
              type: array
              items:
                type: string
                examples:
                - ENST00000269305.9
                - EXON:00004567
        info:
          type: object
          additionalProperties: true
          description: Optional free-form metadata bag.
        matrixIds:
          items:
            type: string
          type: array
          description: list of matrix ids
      required:
      - id
      - featureIdentifier
      - featureType
      title: GenomicFeature
      type: object
    ExpressionValue:
      additionalProperties: true
      description: 'One quantified expression cell: the measured value of a specific
        genomic feature in a specific biosample within a specific matrix.'
      properties:
        id:
          description: Internal Beacon identifier for this expression value entry.
          examples:
          - expressionValue-001
          type: string
        biosampleId:
          description: Reference to the biosample entry id that this value was measured
            in.
          examples:
          - 008dafdd-a3d1-4801-8c0a-8714e2b58e48
          type: string
        value:
          description: Numeric expression quantification for this feature in this
            biosample. Units and scale are defined by the parent matrix (expressionUnitAndScale).
          examples:
          - 100
          type: number
        featureId:
          description: Native accession of the quantified genomic feature as it appears
            in the matrix row. MUST equal featureIdentifier.id of the matching feature.
            Not a CURIE and not genomicFeatures.id.
          examples:
          - ENSG00000141510.18
          - ENST00000269305.9
          type: string
        matrixId:
          description: Reference to the matrix entry id that this value belongs to.
          examples:
          - matrix-gene-expression-001
          type: string
      required:
      - biosampleId
      - value
      - featureId
      - matrixId
      - id
      title: Expression value
      type: object
